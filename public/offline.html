<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bağlantı Yok — Technoscope Randevu</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .badge {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 10px;
  }
  p {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
    max-width: 360px;
    line-height: 1.5;
    margin: 0 0 26px;
  }
  button {
    background: #fff;
    color: #1e3a8a;
    border: none;
    border-radius: 9px;
    padding: 12px 24px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">TR</div>
    <h1>İnternet bağlantısı yok</h1>
    <p>Technoscope Randevu'ya ulaşmak için internet bağlantısı gerekiyor. Bağlantını kontrol edip tekrar dene.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
